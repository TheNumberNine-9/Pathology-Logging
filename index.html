<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pathology Logs</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="clinic-menu">
        <button id="clinicMenuBtn" class="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="clinicMenu" title="Select clinic">
          <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="sr-only">Select clinic</span>
        </button>
        <div id="clinicMenu" class="menu-panel" role="menu" hidden>
          <p class="menu-heading">Select Clinic</p>
          <!-- options rendered by app.js -->
        </div>
      </div>
      <img src="assets/logo.png" alt="Bowral Dermatology logo" class="brand-logo">
      <div class="brand-text">
        <h1>Pathology Logs</h1>
        <p id="clinicTitle">Orange Dermatology</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="notifyBtn" class="btn btn-ghost" type="button" hidden>Enable Notifications</button>
      <button id="openAdd" class="btn btn-primary" type="button">+ New Sample</button>
    </div>
  </header>

  <main class="container">
    <div id="overdueBanner" class="banner" role="status" hidden>
      <span id="overdueText"></span>
      <button id="showOverdue" class="btn btn-small" type="button">View overdue</button>
    </div>

    <section class="summary" aria-label="Status summary">
      <div class="stat"><span class="stat-num" id="countAll">0</span><span class="stat-label">Total Samples</span></div>
      <div class="stat stat-received"><span class="stat-num" id="countReceived">0</span><span class="stat-label">Received</span></div>
      <div class="stat stat-actioned"><span class="stat-num" id="countActioned">0</span><span class="stat-label">Actioned</span></div>
      <div class="stat stat-overdue"><span class="stat-num" id="countOverdue">0</span><span class="stat-label">Received &gt; 2 Weeks</span></div>
    </section>

    <section class="filters" aria-label="Filters">
      <div class="field">
        <label for="filterName">Patient Name</label>
        <input id="filterName" type="search" placeholder="Search by name…" autocomplete="off">
      </div>
      <div class="field">
        <label for="filterNumber">Patient Number</label>
        <input id="filterNumber" type="search" placeholder="Search by number…" autocomplete="off">
      </div>
      <div class="field">
        <label for="filterDoctor">Doctor</label>
        <select id="filterDoctor"><option value="">All doctors</option></select>
      </div>
      <div class="field">
        <label for="filterStatus">Progress</label>
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option value="received">Received</option>
          <option value="actioned">Actioned</option>
          <option value="overdue">Received &gt; 2 weeks</option>
        </select>
      </div>
      <div class="field">
        <label for="sortBy">Sort</label>
        <select id="sortBy">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="waiting">Longest waiting</option>
          <option value="name">Name (A–Z)</option>
          <option value="number">Patient number</option>
        </select>
      </div>
      <button id="clearFilters" class="btn btn-ghost" type="button">Clear</button>
    </section>

    <p class="result-count" id="resultCount" aria-live="polite"></p>
    <section id="grid" class="grid" aria-label="Pathology samples"></section>
    <div id="emptyState" class="empty" hidden>
      <p class="empty-title">No samples found</p>
      <p>Add a new sample or adjust your filters.</p>
    </div>
  </main>

  <footer class="site-footer">
    <span id="footerClinic">Orange Dermatology</span> · Pathology Sample Register · Records are stored in this browser only.
  </footer>

  <dialog id="sampleDialog" class="dialog">
    <form id="sampleForm" method="dialog">
      <h2 id="dialogTitle">New Pathology Sample</h2>
      <input type="hidden" id="sampleId">
      <div class="form-grid">
        <div class="field">
          <label for="patientName">Patient Name *</label>
          <input id="patientName" required autocomplete="off">
        </div>
        <div class="field">
          <label for="patientNumber">Patient Number *</label>
          <input id="patientNumber" required autocomplete="off">
        </div>
        <div class="field">
          <label for="dob">DOB</label>
          <input id="dob" type="date">
        </div>
        <div class="field">
          <label for="clinic">Clinic *</label>
          <select id="clinic" required></select>
        </div>
        <div class="field">
          <label for="doctor">Doctor</label>
          <select id="doctor"></select>
        </div>
        <div class="field">
          <label for="sampleType">Specimen / Site</label>
          <input id="sampleType" placeholder="e.g. Shave biopsy – L forearm" autocomplete="off">
        </div>
        <div class="field">
          <label for="dateTaken">Date Taken</label>
          <input id="dateTaken" type="date">
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="received">Received</option>
            <option value="actioned">Actioned</option>
          </select>
        </div>
        <div class="field">
          <label for="receivedDate">Date Received</label>
          <input id="receivedDate" type="date">
        </div>
        <div class="field field-wide">
          <label for="notes">Notes</label>
          <textarea id="notes" rows="3"></textarea>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="cancelDialog">Cancel</button>
        <button type="submit" class="btn btn-primary" value="save">Save Sample</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
